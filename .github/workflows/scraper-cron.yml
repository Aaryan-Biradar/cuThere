name: Daily Event Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs at 2:00 AM UTC every day.
    - cron: '0 2 * * *'
  workflow_dispatch: # This adds a "Run workflow" button in GitHub so you can test it manually

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    environment: Production # <-- This tells GitHub where to find your secrets!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Matching your local environment

      - name: Install dependencies
        run: npm install # Using npm install instead of npm ci so platform-specific native bindings (e.g. @libsql/linux-x64-gnu) are resolved for the runner OS

      - name: Run pipeline
        run: node src/lib/main.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          
          # Pass all three Apify keys
          APIFY_API_TOKEN_1: ${{ secrets.APIFY_API_TOKEN_1 }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          APIFY_API_TOKEN_3: ${{ secrets.APIFY_API_TOKEN_3 }}
          APIFY_API_TOKEN_4: ${{ secrets.APIFY_API_TOKEN_4 }}
          
          # Pass the GitHub run counter so Node knows whose turn it is
          RUN_NUMBER: ${{ github.run_number }}

      - name: Refresh site cache
        if: success()
        run: |
          curl -fsS -X POST "$SITE_URL/api/revalidate?secret=$REVALIDATE_SECRET" || echo "Revalidate ping failed (non-fatal)"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}